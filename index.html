<script type="text/plain" id="ocr-src">
// 本地认字（照抄渡表僧 v0.2.5 的 worker，一个字没改）。在 Worker 里跑，不卡页面。模型是 PP-OCRv5 mobile（Apache-2.0）：det 找字在哪，rec 一段段认。
// 先把图收拾干净：压平阴影 → 扶正 → 找出表格线（交给拼表）并擦掉（免得被认成 1 或 |）。
let ort = null, det = null, rec = null, dict = null;

async function grab(url, cacheName) {      // 下载一次，存进浏览器的 Cache Storage，下回直接拿
  let cache = null;
  try { cache = await caches.open(cacheName); } catch (e) { /* 没有 Cache Storage 就每次下 */ }
  if (cache) {
    const hit = await cache.match(url);
    if (hit) { const b = await hit.arrayBuffer(); postMessage({ type: 'dl', url, got: b.byteLength, cached: true }); return b; }
  }
  const res = await fetch(url);
  if (!res.ok) throw new Error(`${url.split('/').pop()} 没下载下来：HTTP ${res.status}`);
  const reader = res.body.getReader(), parts = [];
  let got = 0, last = 0;
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    parts.push(value); got += value.length;
    if (got - last > 262144) { last = got; postMessage({ type: 'dl', url, got }); }
  }
  const buf = new Uint8Array(got);
  let o = 0;
  for (const p of parts) { buf.set(p, o); o += p.length; }
  postMessage({ type: 'dl', url, got });
  if (cache) { try { await cache.put(url, new Response(buf.slice())); } catch (e) { /* 存不下就算了，下回再下 */ } }
  return buf.buffer;
}

async function init(m) {
  if (rec) return;
  ort = await import(m.ort + 'ort.wasm.min.mjs');
  ort.env.wasm.numThreads = 1;
  ort.env.logLevel = 'error';
  ort.env.wasm.wasmPaths = m.ort;
  ort.env.wasm.wasmBinary = await grab(m.ort + 'ort-wasm-simd-threaded.wasm', m.cache);
  const opt = { executionProviders: ['wasm'], graphOptimizationLevel: 'all' };
  dict = new TextDecoder().decode(await grab(m.dict, m.cache)).split(/\r?\n/);
  if (dict[dict.length - 1] === '') dict.pop();
  det = await ort.InferenceSession.create(new Uint8Array(await grab(m.det, m.cache)), opt);
  rec = await ort.InferenceSession.create(new Uint8Array(await grab(m.rec, m.cache)), opt);
}

// ---------------------------------------------------------------- 收拾图
function gray(rgba, W, H) {
  const g = new Uint8Array(W * H);
  for (let i = 0, j = 0; i < g.length; i++, j += 4) g[i] = (rgba[j] * 299 + rgba[j + 1] * 587 + rgba[j + 2] * 114) / 1000;
  return g;
}
// 拍照的：透视让表上宽下窄、竖线不平行。表的顶线和底线实际一样长，拿它们的四个端点把整张图拉回长方形
function solve8(A, b) {
  const n = b.length, M = A.map((r, i) => r.concat([b[i]]));
  for (let c = 0; c < n; c++) {
    let p = c;
    for (let r = c + 1; r < n; r++) if (Math.abs(M[r][c]) > Math.abs(M[p][c])) p = r;
    [M[c], M[p]] = [M[p], M[c]];
    if (Math.abs(M[c][c]) < 1e-12) return null;
    for (let r = 0; r < n; r++) if (r !== c) { const f = M[r][c] / M[c][c]; for (let k = c; k <= n; k++) M[r][k] -= f * M[c][k]; }
  }
  return M.map((r, i) => r[n] / r[i]);
}
function looksPhoto(g, W, H) {      // 图的四边一圈明显比中间暗：拍到了桌面
  const bw = Math.max(4, Math.round(0.03 * Math.min(W, H)));
  let es = 0, en = 0, cs = 0, cn = 0;
  for (let y = 0; y < H; y += 3) for (let x = 0; x < W; x += 3) {
    const v = g[y * W + x];
    if (x < bw || y < bw || x >= W - bw || y >= H - bw) { es += v; en++; } else if (x > W / 4 && x < 3 * W / 4 && y > H / 4 && y < 3 * H / 4) { cs += v; cn++; }
  }
  return en && cn && es / en < 0.6 * (cs / cn);
}
function tableQuad(L, W, H, photo) {
  const hs = L.H.filter((h) => h.x1 - h.x0 > 0.25 * W);
  if (hs.length < 2) return null;
  const maxLen = Math.max(...hs.map((h) => h.x1 - h.x0));
  const long = hs.filter((h) => h.x1 - h.x0 > 0.8 * maxLen).sort((a, b) => a.y0 + a.y1 - b.y0 - b.y1);

      for (let x = Math.floor(x0); x < Math.ceil(x1); x++) if (g[y * W + x] < INK) { if (t0 < 0) t0 = y; t1 = y; break; }
    }
    const str = sg.cs.map((c) => c.s).join('').replace(/\s+/g, ' ').trim();
    const ih = t0 < 0 ? gh : t1 - t0 + 1;
    words.push({ s: str, p: cs.map((c) => +c.p.toFixed(4)), x0, x1, y0: t0 < 0 ? j.b.y0 : t0, y1: t0 < 0 ? j.b.y1 : t1 + 1, cy: (j.b.y0 + j.b.y1) / 2,

}

self.onmessage = async (e) => {
  const m = e.data;
  try {
    if (m.type === 'init') { await init(m); postMessage({ type: 'ok', id: m.id }); return; }
    const t0 = performance.now();

<script type="module">
// 誊抄僧：写字框里的字 → 认出标题、名字＋数字、清单、「时间：」这类行 → 按版式排好，画成图分享。
// 排版和出图是同一套 canvas 代码：预览看到什么，分享出去就是什么。
const VERSION = '0.1.0';
const LOCAL = ['localhost', '127.0.0.1'].includes(location.hostname);
const Q = new URLSearchParams(location.search);
const $ = (s) => document.querySelector(s);
const T = window.__teng = { ready: false, log: [] };       // 给测试脚本看的

// ================================================================ 小工具
const CJK = /[⺀-鿿豈-﫿＀-￯　-〿]/;
const store = {
  get(k, d) { try { const v = localStorage.getItem('tengchao.' + k); return v == null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('tengchao.' + k, v); } catch (e) { /* 隐私模式存不了就算了 */ } },
};
const half = (s) => String(s).replace(/[！-～]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/　/g, ' ');

  const d = new Date();
  return { y: d.getFullYear(), m: d.getMonth() + 1, d: d.getDate(), w: WEEK[d.getDay()],
    dot: `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')}` };

// ================================================================ 认结构：一段字 → 标题、名字＋数字、清单、键值、正文、落款
const UNIT_RE = '(?:[%％‰]|[a-zA-Z]{1,5}|[\\u4e00-\\u9fa5]{1,2})';
const NUM_RE = '[-+]?[¥$￥€£]?\\d[\\d,，]*(?:[.．]\\d+)?';
// 名字＋数字：「A线早班 1,280件」「合格率：98.5%」「早班12件」。名字里可以有数字（B2线），但名字要是以数字结尾，后面得空一格
const PAIR = new RegExp(`^(.*?\\S)(?:\\s*[:：=＝]\\s*|\\s+|(?<=[^\\d\\s.,，:：]))(${NUM_RE})\\s*(${UNIT_RE})?$`);
const KV = /^([^\s:：]{1,10})\s*[:：]\s*(\S.*)$/;
const LIST = [
  [/^(\d{1,3})\s*[.、．)）]\s*(\S.*)$/, (m) => m[1] + '.'],
  [/^[（(](\d{1,3})[)）]\s*(\S.*)$/, (m) => `(${m[1]})`],
  [/^([①-⑳])\s*(\S.*)$/, (m) => m[1]],
  [/^([-*•·●○▪■□☐✓√])\s*(\S.*)$/, (m) => (/[-*·▪■]/.test(m[1]) ? '•' : m[1])],
];
const CN_NUM = /^([一二三四五六七八九十]{1,3})[、.．]\s*(\S.*)$/;
const TOTAL = /^(合计|总计|共计|小计|总数|合共|累计|总共|总产量|总量)/;
const DATE_ONLY = /^\s*(\d{4}\s*[年./-]\s*)?\d{1,2}\s*[月./-]\s*\d{1,2}\s*[日号]?\s*([（(]?(星期|周)[一二三四五六日天][）)]?)?\s*$/;
const END_PUNCT = /[。.！!？?；;，,、…]$/;
const KNOWN_UNIT = '(?:件|个|只|台|套|箱|包|袋|瓶|桶|张|本|支|条|根|块|片|卷|米|公斤|斤|吨|kg|KG|g|元|人|名|次|天|小时|分钟|h|H|pcs|PCS|%|％)';

function parseNum(raw) {
  const s = half(raw).replace(/，/g, ',').replace(/．/g, '.');
  const m = s.match(/^([-+]?)([¥$€£]?)(\d[\d,]*)(\.\d+)?$/);
  if (!m) return null;
  return { int: m[1] + m[2] + m[3], frac: m[4] || '', v: Number((m[1] + m[3]).replace(/,/g, '') + (m[4] || '')) };
}
function asPair(line) {
  if (DATE_ONLY.test(line) || /^\d{1,2}[:：]\d{2}$/.test(line.trim())) return null;       // 日期、钟点不算「名字＋数字」
  const m = line.match(PAIR);
  if (!m) return null;
  if (/\d\s*[:：]?$/.test(m[1]) && /[:：]/.test(line.slice(m[1].length, m[1].length + 3))) return null;    // 「8:00」的冒号不是分隔
  if (/\d[/\-.．]$/.test(m[1])) return null;                                                     // 「11/1」「11-1」这种日期的后半截不是数

  // 「本月出勤：张师傅22天，李师傅20天…」：开头那段冒号前面是个小标题，拆出来单独一行

    const out = [];
    for (let i = 0; i < toks.length; i += 2) out.push(`${toks[i]} ${toks[i + 1]}`);
    return out;
  }
  // 没有分隔符的一坨（「A线早班12件B线早班9件…」）：每段都得带常见单位，名字至少两个字、不能是年月日钟点；
  // 一行里有「时间：」这种冒号，或者 8:00 这种钟点，一律不拆
  const re = new RegExp(`([^\\s\\d，,；;、:：]{2,16}?)\\s*(${NUM_RE})\\s*(${KNOWN_UNIT})(?=\\s|[，,；;、]|$|[^\\s\\d，,；;、])`, 'g');
  const hits = /[:：]/.test(t) ? [] : [...t.matchAll(re)].filter((h) => !/[年月日号点时分秒]$/.test(h[1]) && !/^[年月日号点时分秒]/.test(h[1]));
  if (hits.length >= 3) {
    const covered = hits.reduce((n, h) => n + h[0].replace(/\s/g, '').length, 0), total = t.replace(/[\s，,；;、]/g, '').length;
    if (covered >= 0.92 * total) return hits.map((h) => h[0].trim());
  }
  const nums = [...t.matchAll(/(?:^|\s)(\d{1,2})[.、．]\s*(?=\S)/g)];
  if (nums.length >= 2 && nums[0].index === 0) {
    const cuts = nums.map((x) => x.index + (x[0].startsWith(' ') ? 1 : 0));
    return cuts.map((c, i) => t.slice(c, cuts[i + 1]).trim()).filter(Boolean);
  }
  return [t];
}

function titleish(s) {
  const t = s.trim();
  if (!t || asPair(t) || asList(t) || KV.test(t) && !/^[【\[]/.test(t)) return false;
  if (/^[【\[《].{1,20}[】\]》]$/.test(t)) return true;
  return dw(t) <= 30 && !END_PUNCT.test(t.replace(/[:：]$/, ''));
}

// lines：[{s, id}]，id 是原文第几行（拆开的一坨用 "5.2" 这种）
function toLines(text) {
  const out = [];
  // 只把全角的字母数字、全角空格换成半角；中文标点照原样留着（显示用）
  String(text).replace(/[０-９Ａ-Ｚａ-ｚ]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/　/g, ' ')
    .replace(/\r/g, '').replace(/\t/g, '  ').split('\n').forEach((raw, i) => {
    const s = raw.replace(/\s+$/, '');
    if (!s.trim()) { out.push({ s: '', id: String(i) }); return; }
    const parts = splitBlob(s);
    parts.forEach((p, j) => out.push({ s: p.trim(), id: parts.length > 1 ? `${i}.${j}` : String(i) }));
  });

// title：null = 自动认；'' = 不要标题；'行号' = 用这一行
function parse(text, title = null) {
  const lines = toLines(text);
  const blocks = [];
  const live = lines.filter((l) => l.s);
  if (!live.length) return { blocks, title: null };

    const first = live[0], second = live[1];
    if (DATE_ONLY.test(first.s) && second && titleish(second.s) && live.length > 2) { tIdx = lines.indexOf(second); meta = first.s; }

    blocks.push({ k: 'title', s: titleText, id: lines[tIdx].id });

    if (!meta && after && DATE_ONLY.test(after.s)) { meta = after.s; after.used = true; }
    if (meta) blocks.push({ k: 'meta', s: meta });
    if (meta) for (const l of lines) if (l.s === meta && l !== lines[tIdx]) { l.used = true; break; }
  }

  while (body.length && !body[body.length - 1].s) body.pop();

  const hasPara = body.some((l) => l.s && !asPair(l.s) && !asList(l.s) && !KV.test(l.s) && dw(l.s) > 30);
  let sign = [];
  if (hasPara) {
    let k = body.length - 1;
    const cand = [];
    while (k >= 0 && cand.length < 2) {
      const l = body[k];
      if (!l.s || dw(l.s) > 28 || asPair(l.s) || asList(l.s) || END_PUNCT.test(l.s)) break;
      cand.unshift(l); k--;
    }
    const before = body[k];
    if (cand.length && ((before && !before.s) || /^[—-]{1,2}/.test(cand[0].s) || cand.some((l) => DATE_ONLY.test(l.s)))) {
      sign = cand;
      body.splice(body.length - sign.length);

    const li = asList(l.s);
    if (li) { const p = asPair(li.body); return { k: 'row', marker: li.marker, ...(p || { label: li.body }), id: l.id }; }
    const cn = l.s.match(CN_NUM);

      if (dw(cn[2]) <= 24 && !END_PUNCT.test(cn[2])) return { k: 'sub', s: `${cn[1]}、${cn[2]}`, id: l.id };
      return { k: 'row', marker: `${cn[1]}、`, label: cn[2], id: l.id };
    }
    const p = asPair(l.s);
    if (p) return { k: 'row', ...p, id: l.id };

    if (kv && dw(kv[1]) <= 12 && dw(kv[2]) <= 48 && !/^https?$/i.test(kv[1])) return { k: 'kv', key: kv[1], val: kv[2], id: l.id };
    if (/[:：]$/.test(l.s) && dw(l.s) <= 26) return { k: 'sub', s: l.s.replace(/[:：]$/, ''), raw: l.s, id: l.id };
    if (/^[【\[].{1,20}[】\]]$/.test(l.s)) return { k: 'sub', s: l.s.slice(1, -1), id: l.id };

    const x = kindOf(l);

    if (x.k === 'row' || x.k === 'kv') {
      if (cur && cur.k === x.k + 's') { cur.items.push(x); continue; }

      continue;
    }

    blocks.push(x);

const fontOf = (t, size, weight = 400, fam) => `${weight} ${size}px ${fam || t.font}`;
const measureCtx = document.createElement('canvas').getContext('2d');

const NO_START = '，。、；：！？）」』”’》】…,.;:!?)]}%％‰·';
const NO_END = '（「『“‘《【([{¥$￥';
function tokens(s) {
  const out = [];
  const re = /[A-Za-z0-9][A-Za-z0-9.,:%'’\-_/@#&+]*|\s+|./gsu;
  for (const m of s.matchAll(re)) out.push(m[0]);

}
// 按宽度折行：汉字一个一个折，英文数字整词折；标点不放行首（挂在行尾）
function wrap(text, font, maxW) {
  measureCtx.font = font;
  const toks = tokens(text), lines = [];
  let cur = '', w = 0;
  const push = () => { lines.push(cur.replace(/\s+$/, '')); cur = ''; w = 0; };
  for (let i = 0; i < toks.length; i++) {
    let tk = toks[i];
    if (!cur && /^\s+$/.test(tk)) continue;
    const tw = measureCtx.measureText(tk).width;
    if (w + tw <= maxW || !cur) {
      if (tw > maxW && tk.length > 1) {          // 一个词比一行还长：硬折
        for (const ch of tk) { const cw = measureCtx.measureText(ch).width; if (w + cw > maxW && cur) push(); cur += ch; w += cw; }
        continue;
      }
      cur += tk; w += tw; continue;
    }
    if (NO_START.includes(tk[0]) && tk.length === 1) { cur += tk; w += tw; continue; }       // 标点挂在行尾
    let carry = '';
    while (cur && NO_END.includes(cur[cur.length - 1])) { carry = cur[cur.length - 1] + carry; cur = cur.slice(0, -1); }
    push();
    if (/^\s+$/.test(tk)) { tk = ''; }
    cur = carry + tk; w = measureCtx.measureText(cur).width;
  }
  if (cur || !lines.length) push();
  return lines;
}

function layout(model, t, opt = {}) {

  const metaText = metaB ? metaB.s : null;

  // 标题里已经写了日期（「11月1日 各线产量」），版式就不再自动印今天的日期，免得重复

  const DATE_IN = /\d{1,2}\s*月\s*\d{1,2}\s*[日号]?|\d{4}\s*[./-]\s*\d{1,2}\s*[./-]\s*\d{1,2}/;

  if (t.meta.pos === 'top') {

    if (s) {
      text(s, x0, y + S(t.meta.size), fontOf(t, S(t.meta.size), 500), t.muted);

        if (tt.hl) { const lw = mw(l, font); ops.push({ k: 'rect', x: x - 2, y: yb - size * 0.36, w: lw + 4, h: size * 0.42, color: tt.hl, r: 2 }); }

      const numColW = nums.length ? intW + fracW + (unitW ? S(3) + unitW : 0) : 0;
      const boxed = (it) => t.marker.box && /^[•·□☐✓√○●]$/.test(it.marker || '');
      const allBox = b.items.every((it) => !it.marker || boxed(it));
      const labX = x0 + (allBox && mkW ? S(16) : mkW) + mkGap;
      const valX = x1 - numColW;
      const anchor = valX + intW;
      for (const it of b.items) {
        const y0 = y;
        const avail = (it.num ? valX - S(16) : x1) - labX;
        const lab = wrapIndent(it.label, it.total ? fontOf(t, size, 700) : labFont, avail, 0);
        const hRow = rowLh + (lab.length - 1) * bodyLh;
        const yb = y + size * 0.92 + (rowLh - size) / 2;
        if (it.total) line(x0, y + S(1), x1, y + S(1), t.rule, 0.8);
        if (it.marker) {
          if (boxed(it)) ops.push({ k: 'rect', x: x0, y: yb - size * 0.78, w: S(11), h: S(11), color: null, stroke: t.marker.color, r: S(2.5) });
          else if (t.marker.dot && /^[•·]$/.test(it.marker)) ops.push({ k: 'dot', x: x0 + mkW / 2, y: yb - size * 0.33, r: S(3), color: t.marker.color });
          else text(it.marker, x0 + mkW, yb, mkFont, t.marker.color, 'right');
        }
        lab.forEach((l, i) => text(l, labX, yb + i * bodyLh, it.total ? fontOf(t, size, 700) : labFont, it.total ? t.ink : t.body));
        if (it.num) {
          const nc = t.numColor || t.ink;
          if (t.leader) {
            const lw = mw(lab[lab.length - 1], labFont);
            const la = labX + lw + S(8), lb = valX - S(8);
            if (lb - la > S(16)) line(la, yb - size * 0.22 + (lab.length - 1) * bodyLh, lb, yb - size * 0.22 + (lab.length - 1) * bodyLh, 'rgba(0,0,0,.28)', 1, [1.2, 3.2]);
          }
          const ny = yb + (lab.length - 1) * bodyLh;
          text(it.num.int, anchor, ny, numFont, nc, 'right');
          if (it.num.frac) text(it.num.frac, anchor, ny, numFont, nc, 'left');
          if (it.unit) text(it.unit, anchor + fracW + S(3), ny, unitFont, t.muted, 'left');
        }
        if (t.ruled) line(x0, y + hRow - S(5), x1, y + hRow - S(5), t.rule, 0.7);
        y += hRow;
        hits.push({ y0, y1: y, id: it.id });

      continue;

    if (b.k === 'sign') {

    text(`${date.dot}`, x0, y + fs, fontOf(t, fs, 500), t.muted);
    y += fs;
  } else if (fk === 'letter') {
    text('— 誊抄僧 —', W / 2, y + fs + S(4), fontOf(t, fs, 400), t.muted, 'center', { ls: 2 });
    y += fs + S(4);
  } else if (fk === 'kraft') {
    line(x0, y, x1, y, t.rule, 0.8, [3, 3]); y += S(14);
    text('誊抄僧', x0, y + fs, fontOf(t, fs, 700), t.muted, 'left', { ls: 1.5 });
    text(date.dot, x1, y + fs, fontOf(t, fs, 500), t.muted, 'right');
    y += fs;
  } else if (fk === 'mag') {
    line(x0, y, x1, y, '#111', 2.2); y += S(12);
    text('誊抄僧', x0, y + fs, fontOf(t, fs, 700), '#111', 'left', { ls: 1.2 });
    text(date.dot, x1, y + fs, fontOf(t, fs, 500), t.muted, 'right');
    y += fs;
  } else if (fk === 'notice') {
    text('誊抄僧', W / 2, y + fs, fontOf(t, fs, 500), t.muted, 'center', { ls: 2 });
    y += fs;
  } else {
    text('誊抄僧', x1, y + fs, fontOf(t, fs, 600), t.muted, 'right', { ls: 1 });
    y += fs;
  }
  return { ops, hits, h: y + pb };
}
// 标题折成几行时尽量一样长（不留「修」这种孤字）：行数不变的前提下把行宽收到最窄
function wrapBalance(s, font, cw) {
  const ls = wrap(s, font, cw);
  if (ls.length < 2) return ls;
  let lo = cw * 0.5, hi = cw;
  for (let i = 0; i < 12; i++) { const mid = (lo + hi) / 2; if (wrap(s, font, mid).length > ls.length) lo = mid; else hi = mid; }
  return wrap(s, font, hi);
}
function wrapIndent(s, font, cw, indent = 0) {
  const go = (w) => {
    if (!indent) return wrap(s, font, w);
    const firstLine = wrap(s, font, w - indent)[0] || '';
    const rest = s.slice(firstLine.length).replace(/^\s+/, '');
    return rest ? [firstLine, ...wrap(rest, font, w)] : [firstLine];
  };
  let ls = go(cw);
  // 最后一行只剩一两个字（「据存好。」那种孤字）：把行宽收一点，让上一行匀几个字下来；行数不许变多
  const tail = (x) => [...x[x.length - 1].replace(/[，。、；：！？,.;:!?）」』”’》】…]+$/, '')].length;
  if (ls.length >= 2 && tail(ls) <= 2) {
    const ch = mw('字', font);
    for (let k = 1; k <= 6; k++) {
      const t2 = go(cw - k * ch);
      if (t2.length > ls.length) break;
      if (tail(t2) >= 3) { ls = t2; break; }
    }
  }
  return ls;
}

// 固定比例：装不下先把字缩一点（最多缩到 0.78），还装不下就让图变长
function fit(model, t, ratio) {
  if (ratio === 'auto') { const L = layout(model, t); return { ...L, H: Math.ceil(L.h), fs: 1 }; }
  const target = ratio === '1:1' ? W : Math.round(W * 4 / 3);
  let fs = 1, L = layout(model, t, { fs });
  while (L.h > target && fs > 0.78) { fs = Math.round((fs - 0.04) * 100) / 100; L = layout(model, t, { fs }); }
  const H = Math.max(target, Math.ceil(L.h));
  let dy = 0;
  if (H > L.h && t.vcenter) dy = Math.floor((H - L.h) / 2);
  return { ...L, H, fs, dy, over: L.h > target };
}

function paint(canvas, model, t, ratio, scale) {
  const R = fit(model, t, ratio);
  canvas.width = Math.round(W * scale); canvas.height = Math.round(R.H * scale);
  const c = canvas.getContext('2d');
  c.setTransform(scale, 0, 0, scale, 0, 0);
  t.bg(c, W, R.H);
  c.translate(0, R.dy || 0);
  c.textBaseline = 'alphabetic';
  for (const o of R.ops) {
    if (o.k === 'text') {
      c.font = o.font; c.fillStyle = o.color; c.textAlign = o.align;
      if ('letterSpacing' in c) c.letterSpacing = `${o.ls || 0}px`;
      c.fillText(o.s, o.x, o.y);
      if ('letterSpacing' in c) c.letterSpacing = '0px';
    } else if (o.k === 'line') {
      c.strokeStyle = o.color; c.lineWidth = o.w; c.setLineDash(o.dash || []);
      c.beginPath(); c.moveTo(o.xa, o.ya); c.lineTo(o.xb, o.yb); c.stroke(); c.setLineDash([]);
    } else if (o.k === 'rect') {
      c.save();
      if (o.shadow) { c.shadowColor = 'rgba(60,40,20,.22)'; c.shadowBlur = 6; c.shadowOffsetY = 1.5; }
      c.beginPath();
      if (c.roundRect) c.roundRect(o.x, o.y, o.w, o.h, o.r || 0); else c.rect(o.x, o.y, o.w, o.h);
      if (o.color) { c.fillStyle = o.color; c.fill(); }
      if (o.stroke) { c.shadowColor = 'transparent'; c.strokeStyle = o.stroke; c.lineWidth = 1.3; c.stroke(); }
      c.restore();
    } else if (o.k === 'dot') {
      c.fillStyle = o.color; c.beginPath(); c.arc(o.x, o.y, o.r, 0, Math.PI * 2); c.fill();
    }
  }
  return R;
}

function shiftMarks(oldV, newV) {

  let p = 0;
  while (p < oldV.length && p < newV.length && oldV[p] === newV[p]) p++;
  let a = oldV.length, b = newV.length;

  const d = newV.length - oldV.length;
  S.marks = S.marks.flatMap(([x, y]) => (y <= p ? [[x, y]] : x >= a ? [[x + d, y + d]] : []));

const OCR = { w: null, ready: null, seq: 0, wait: new Map(), got: {} };
function ocrWorker() {
  if (OCR.w) return OCR.w;
  const url = URL.createObjectURL(new Blob([$('#ocr-src').textContent], { type: 'text/javascript' }));
  const w = OCR.w = new Worker(url, { type: 'module' });
  w.onmessage = (e) => {
    const m = e.data;
    if (m.type === 'dl') {
      OCR.got[m.url] = m.got;

        const pct = Math.min(99, Math.round(Object.values(OCR.got).reduce((p, q) => p + q, 0) / OCR_BYTES * 100));
        progress(`第一次认手写，先下 ${OCR_MB} MB 的眼珠子，存进浏览器，下回不用再下 · ${pct}%`, pct / 100 * 0.6);
      }

    const p = OCR.wait.get(m.id);

    OCR.wait.clear(); OCR.w = null; OCR.ready = null;

    bmp = await new Promise((ok, bad) => { const im = new Image(); im.onload = () => ok(im); im.onerror = () => bad(new Error('这张图打不开')); im.src = url; });
  }
  const k = Math.min(1, OCR_SIDE / Math.max(bmp.width, bmp.height));
  const cv = document.createElement('canvas');
  cv.width = Math.round(bmp.width * k); cv.height = Math.round(bmp.height * k);
  const c = cv.getContext('2d', { willReadFrequently: true });
  c.fillStyle = '#fff'; c.fillRect(0, 0, cv.width, cv.height);
  c.drawImage(bmp, 0, 0, cv.width, cv.height);
  return cv;
}

// 认出来的词 → 一行一行的字，记下哪些字拿不准
function wordsToText(words) {
  const ws = words.filter((w) => w.s && w.s.trim()).map((w) => ({ ...w, h: Math.max(4, w.y1 - w.y0), cy: w.cy != null ? w.cy : (w.y0 + w.y1) / 2 }));
  if (!ws.length) return { text: '', marks: [] };
  const hs = ws.map((w) => w.h).sort((p, q) => p - q), mh = hs[hs.length >> 1];
  ws.sort((p, q) => p.cy - q.cy);
  const lines = [];
  for (const w of ws) {
    const L = lines.find((l) => Math.abs(l.cy - w.cy) < 0.55 * Math.max(mh, Math.min(l.h, w.h)));
    if (L) { L.ws.push(w); L.cy = (L.cy * (L.ws.length - 1) + w.cy) / L.ws.length; L.h = Math.max(L.h, w.h); }
    else lines.push({ cy: w.cy, h: w.h, ws: [w] });
  }
  lines.sort((p, q) => p.cy - q.cy);
  const gaps = [];
  for (let i = 1; i < lines.length; i++) gaps.push(lines[i].cy - lines[i - 1].cy);
  const pitch = gaps.length ? [...gaps].sort((p, q) => p - q)[gaps.length >> 1] : mh * 1.6;
  let text = '';
  const marks = [];
  lines.forEach((L, li) => {
    if (li > 0) text += lines[li].cy - lines[li - 1].cy > 1.75 * pitch ? '\n\n' : '\n';
    L.ws.sort((p, q) => p.x0 - q.x0);
    L.ws.forEach((w, wi) => {
      if (wi > 0) {
        const prev = L.ws[wi - 1], gap = w.x0 - prev.x1;
        const cjkJoin = CJK.test(prev.s.slice(-1)) && CJK.test(w.s[0]);
        if (gap > 0.9 * mh || !cjkJoin) text += ' ';
      }
      const chars = [...w.s.trim()];
      let k = 0;
      for (const ch of chars) {
        const at = text.length;
        text += ch;
        if (/\s/.test(ch)) continue;
        const p = w.p && w.p[k] != null ? w.p[k] : 1;
        k++;
        if (p < SURE) marks.push([at, at + ch.length]);
      }
    });
  });
  // 挨着的黄字并成一段
  const merged = [];
  for (const m of marks) { const l = merged[merged.length - 1]; if (l && l[1] === m[0]) l[1] = m[1]; else merged.push([...m]); }
  return { text, marks: merged };
}

async function readLocal(cv) {
  await ocrReady();
  progress('你可以去摸鱼了，剩下的交给老衲。', 0.65);
  const c = cv.getContext('2d', { willReadFrequently: true });
  const im = c.getImageData(0, 0, cv.width, cv.height);
  const s = Math.max(cv.width, cv.height) / 842;          // 当成一张 A4：worker 里找线的门槛按这个算
  const r = await ocrCall({ type: 'page', rgba: im.data.buffer, W: cv.width, H: cv.height, s }, [im.data.buffer]);
  T.ocr = { words: r.words.length, ms: r.ms, angle: r.angle, quad: !!r.quad };
  return wordsToText(r.words);
}

// ---------------------------------------------------------------- 借谷歌认手写（钥匙、报错、额度的做法照录入僧网页版）
class ApiError extends Error {
  constructor(status, message, detail = '') { super(message); this.status = status; this.detail = detail; }
  raw() { return this.status ? `HTTP ${this.status}：${this.message}` : this.message; }
}
class Fatal extends Error {}
function nthSunday(year, month, n) { const d = new Date(Date.UTC(year, month - 1, 1)); return Date.UTC(year, month - 1, 1 + (7 - d.getUTCDay()) % 7 + (n - 1) * 7); }
function pacificOffsetHours(ms) {
  const y = new Date(ms).getUTCFullYear();
  return ms >= nthSunday(y, 3, 2) + 10 * 3600e3 && ms < nthSunday(y, 11, 1) + 9 * 3600e3 ? -7 : -8;
}
function nextPacificMidnight(now) {
  const off = pacificOffsetHours(now), local = new Date(now + off * 3600e3);
  const mid = Date.UTC(local.getUTCFullYear(), local.getUTCMonth(), local.getUTCDate() + 1);
  return mid - pacificOffsetHours(mid - off * 3600e3) * 3600e3 + 30e3;
}
class Keys {
  constructor(list) { this.keys = list.map((k) => (k || '').trim()).filter(Boolean); this.dead = this.keys.map(() => 0); }
  pick() { const now = Date.now(); for (let i = 0; i < this.keys.length; i++) if (this.dead[i] <= now) return [i, this.keys[i]]; return [null, Math.min(...this.dead)]; }
  park(i, until) { this.dead[i] = Math.max(this.dead[i], until); }
}
const PROMPT = `你是誊抄员。把照片里手写或印刷的字一个不落地抄下来。
- 一行一行照原样抄，原来换行的地方换行，空了一行的地方也空一行。
- 照抄：数字、单位、标点、编号（1. ① 一、）都跟原样一样，不改写、不润色、不补字。
- 看不清的字写 □，不要猜。
- 照片里没有字就返回空串。`;
const SCHEMA = { type: 'OBJECT', properties: { text: { type: 'STRING' } }, required: ['text'] };
function genConfig(model, schema) {
  const gen = { responseMimeType: 'application/json' };
  if (schema) gen.responseSchema = SCHEMA;
  if (/^gemini-[12]\./.test(model)) gen.temperature = 0.1;          // Gemini 3 起不发采样参数
  if (/^gemini-2\.5-flash(?!-lite)/.test(model)) gen.thinkingConfig = { thinkingBudget: 0 };
  return gen;
}
function buildBody(b64, model, schema) {
  return { systemInstruction: { parts: [{ text: PROMPT }] },
    contents: [{ role: 'user', parts: [{ text: '把这张照片里的字一行一行抄出来。' }, { inline_data: { mime_type: 'image/jpeg', data: b64 } }] }],
    generationConfig: genConfig(model, schema) };
}
async function callApi(model, key, body) {
  // 钥匙只走 URL 参数 ?key=。报错原样带回 HTTP 状态码和谷歌的 error.message
  const url = `${API_BASE.replace(/\/$/, '')}/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(key)}`;
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(new Error('timeout')), TIMEOUT * 1000);
  let res, raw;
  try {
    res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), signal: ctl.signal });
    raw = await res.text();
  } catch (e) {
    throw new ApiError(0, `网络错误：${ctl.signal.aborted ? `等了 ${TIMEOUT} 秒没回音` : (e && e.message) || String(e)}`);
  } finally { clearTimeout(timer); }
  if (!res.ok) {
    let msg = raw.slice(0, 500) || res.statusText || '', detail = '';
    try { const err = JSON.parse(raw).error || {}; msg = err.message || msg; detail = JSON.stringify(err.details || ''); } catch (e) { /* 原样 */ }
    throw new ApiError(res.status, msg, detail);
  }
  try { return JSON.parse(raw); } catch (e) { throw new ApiError(0, '返回的不是 JSON：' + raw.slice(0, 300)); }
}
function parseText(data) {
  const parts = (((data.candidates || [])[0] || {}).content || {}).parts || [];
  const txt = parts.map((p) => p.text || '').join('').trim().replace(/^```(?:json)?\s*|\s*```$/g, '');
  if (!txt) {
    const why = ((data.candidates || [])[0] || {}).finishReason || (data.promptFeedback || {}).blockReason || '空的';
    throw new ApiError(0, `模型没回内容：${why}`);
  }
  let obj;
  try { obj = JSON.parse(txt); } catch (e) { throw new ApiError(0, '模型回的不是 JSON：' + txt.slice(0, 300)); }
  if (typeof obj === 'string') return obj;
  if (!obj || typeof obj.text !== 'string') throw new ApiError(0, '模型回的 JSON 里没有 text：' + txt.slice(0, 300));
  return obj.text;
}
const retryDelay = (d) => { const m = String(d || '').match(/"retryDelay"\s*:\s*"(\d+(?:\.\d+)?)s"/); return m ? parseFloat(m[1]) : null; };
function classify429(e) { const s = `${e.message} ${e.detail}`; if (/prepay/i.test(s)) return 'prepay'; if (/PerDay|per day|daily/i.test(s)) return 'day'; return 'minute'; }
const two = (n) => String(n).padStart(2, '0');
const when = (ms) => { const d = new Date(ms); return `${two(d.getMonth() + 1)}-${two(d.getDate())} ${two(d.getHours())}:${two(d.getMinutes())}`; };
const sleep = (ms) => new Promise((ok) => setTimeout(ok, ms * SPEED));

class Engine {
  constructor(list, model) { this.keys = new Keys(list); this.model = model; this.useSchema = true; }
  async read(b64) {
    let minuteHits = 0, netTries = 0;
    for (;;) {
      const [i, key] = this.keys.pick();
      if (i === null) {
        const secs = Math.max(0, (key - Date.now()) / 1000);
        if (secs > 120) throw new Fatal(`所有钥匙今天的额度都用完了，${when(key)} 刷新`);
        progress(`每分钟次数到顶，等 ${Math.ceil(secs)} 秒`, 0.5);
        await new Promise((ok) => setTimeout(ok, Math.max(0, key - Date.now())));
        continue;
      }
      try {
        return parseText(await callApi(this.model, key, buildBody(b64, this.model, this.useSchema)));
      } catch (e) {
        if (!(e instanceof ApiError)) throw e;
        if (e.status === 429) {
          const kind = classify429(e);
          if (kind === 'prepay') throw new Fatal(`钥匙${i + 1} · ${e.raw()}`);
          if (kind === 'day') { const now = Date.now(); this.keys.park(i, now + (nextPacificMidnight(now) - now) * SPEED); progress(`钥匙${i + 1} 今天的额度用完了 · ${e.raw()}`, 0.5); }
          else {
            if (++minuteHits > MAX_MINUTE_WAITS) throw e;
            const d = retryDelay(e.detail);
            const w = d === null ? MINUTE_WAIT : Math.min(MINUTE_WAIT, Math.max(3, d + 1));
            this.keys.park(i, Date.now() + w * 1000 * SPEED);
            progress(`钥匙${i + 1} 每分钟次数到顶 · ${e.raw()}`, 0.5);
          }
          continue;
        }
        if (e.status === 400 && /schema/i.test(e.message) && this.useSchema) { this.useSchema = false; continue; }
        if ([400, 401, 403].includes(e.status) && /API key|API_KEY|permission|PERMISSION/.test(`${e.message} ${e.detail}`)) throw new Fatal(`钥匙${i + 1} · ${e.raw()}`);
        if (e.status === 404) throw new Fatal(`${this.model} · ${e.raw()}`);
        if (e.status === 0 || e.status >= 500) {
          if (netTries < RETRY_WAITS.length) { const w = RETRY_WAITS[netTries++]; progress(`${e.raw()} · ${w} 秒后重试`, 0.5); await sleep(w * 1000); continue; }
        }
        throw e;
      }
    }
  }
}
// 认两遍对答案：两遍一样就不标；不一样的字标黄（照第一遍放）
function diffMarks(a, b) {
  if (a === b) return [];
  const A = [...a], B = [...b], n = A.length, m = B.length;
  if (n * m > 4e6) return [[0, a.length]];
  const L = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i][j] = A[i] === B[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const keep = new Uint8Array(n);
  for (let i = 0, j = 0; i < n && j < m;) { if (A[i] === B[j]) { keep[i] = 1; i++; j++; } else if (L[i + 1][j] >= L[i][j + 1]) i++; else j++; }
  const marks = [];
  let at = 0;
  for (let i = 0; i < n; i++) { const len = A[i].length; if (!keep[i] && !/\s/.test(A[i])) { const l = marks[marks.length - 1]; if (l && l[1] === at) l[1] = at + len; else marks.push([at, at + len]); } at += len; }
  return marks;
}
async function readGemini(cv) {
  const eng = new Engine(keys.list, store.get('model', DEFAULT_MODEL));
  const k = Math.min(1, 2048 / Math.max(cv.width, cv.height));
  let src = cv;
  if (k < 1) { src = document.createElement('canvas'); src.width = Math.round(cv.width * k); src.height = Math.round(cv.height * k); src.getContext('2d').drawImage(cv, 0, 0, src.width, src.height); }
  const b64 = src.toDataURL('image/jpeg', 0.9).split(',')[1];
  progress('借谷歌的眼睛看，认两遍对答案…', 0.3);
  const [a, b] = await Promise.all([eng.read(b64), eng.read(b64)]);
  const text = a.replace(/\r/g, '');
  const marks = diffMarks(text, b.replace(/\r/g, ''));
  for (const m of text.matchAll(/□/g)) marks.push([m.index, m.index + 1]);
  return { text, marks: marks.sort((p, q) => p[0] - q[0]) };
}

async function readPhoto(file) {
  if (!file) return;
  T.reading = true;
  progress('你可以去摸鱼了，剩下的交给老衲。', 0.05);
  const t0 = performance.now();
  try {
    const cv = await loadImage(file);
    let got, via = 'local', why = '';
    if (keys.list.length) {
      try { got = await readGemini(cv); via = 'gemini'; }
      catch (e) { why = e instanceof ApiError ? e.raw() : e.message; }
    }
    if (!got) got = await readLocal(cv);
    T.readMs = Math.round(performance.now() - t0);
    T.via = via;
    if (!got.text.trim()) { setStatus(why ? `谷歌那边出了岔子（${esc(why)}），本地也没认出字。` : '没认出字。纸拍正一点、亮一点再来一张。', true); return; }
    const base = ta.value.replace(/\s+$/, '');
    const off = base ? base.length + 2 : 0;
    ta.value = base ? `${base}\n\n${got.text}` : got.text;
    S.marks = S.marks.concat(got.marks.map(([a, b]) => [a + off, b + off]));
    S.prev = ta.value;
    onText();
    const n = got.marks.reduce((p, [a, b]) => p + [...ta.value.slice(a + off, b + off)].length, 0);
    let msg = n ? `认完了。<b>标黄</b>的 ${n} 个字贫僧拿不准，点一下就能改。` : '认完了。';
    if (why) msg = `谷歌那边出了岔子，先本地认了：${esc(why)}<br>` + msg;
    setStatus(msg, !!why);
  } catch (e) {
    setStatus(`没认成：${esc(e.message || String(e))}`, true);
  } finally {
    T.reading = false;
  }
}
