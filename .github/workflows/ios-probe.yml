name: iOS probe
# 探路用：打 tag 之前把「出 .ipa」那几步空跑一遍（编真机 Release、打包、核 SideStore 源），不发 Releases、不提交。只在手动或改它自己时跑。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/ios-probe.yml']

env:
  XCODE: /Applications/Xcode_26.6.app
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1

jobs:
  dry-release:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Xcode 26
        run: |
          sudo xcode-select -s "$XCODE"
          brew install xcodegen
          cd ios && xcodegen generate && bash tools/fix_regions.sh Yiye.xcodeproj/project.pbxproj

      - name: 编未签名的 .ipa（空跑）
        run: |
          set -o pipefail
          V=0.1.0
          xcodebuild -project ios/Yiye.xcodeproj -scheme Yiye -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee build.log | xcbeautify --renderer github-actions
          rm -rf out && mkdir -p out/Payload
          cp -R build/Build/Products/Release-iphoneos/Yiye.app out/Payload/
          (cd out && zip -qry "../Yiye-$V.ipa" Payload)
          ls -la "Yiye-$V.ipa"
          A=out/Payload/Yiye.app
          ls "$A"
          ls "$A"/*.lproj
          lipo -info "$A/Yiye"
          otool -l "$A/Yiye" | grep -A4 LC_BUILD_VERSION | head -6
          plutil -convert json -o info.json "$A/Info.plist"
          python3 -c "import json; d=json.load(open('info.json')); print(json.dumps({k: d[k] for k in sorted(d) if k.startswith(('CFBundle', 'Minimum', 'UI', 'NS', 'LS'))}, ensure_ascii=False, indent=1))"

      - name: 编不过：把错误原样贴出来
        if: failure()
        run: grep -E "error:" build.log | sort -u | head -80 || true

      - name: 核 SideStore 源（空跑，不提交）
        run: |
          V=0.1.0
          SIZE=$(stat -f%z "Yiye-$V.ipa")
          python3 ios/tools/update_source.py "$V" "$SIZE" "https://github.com/QIANSHOULAB/qianye/releases/download/ios-v$V/Yiye-$V.ipa"
          python3 ios/tools/check_source.py info.json
