# 一叶笺 iPhone 版：XcodeGen 在 CI 里生成 Yiye.xcodeproj，不手写 pbxproj
name: Yiye
options:
  bundleIdPrefix: lab.qianshou
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.7.30"
    CURRENT_PROJECT_VERSION: "31"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  YiyeKit:
    path: YiyeKit
  YiyeOCR:
    path: YiyeOCR
targets:
  Yiye:
    type: application
    platform: iOS
    sources:
      - path: Yiye
    dependencies:
      - package: YiyeKit
      - package: YiyeOCR
      - target: YiyeLive
    info:
      path: Yiye/Info.plist
      properties:
        CFBundleDisplayName: Yiye
        CFBundleName: Yiye
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, zh-Hans]
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UIDesignRequiresCompatibility: true
        UILaunchScreen:
          UIColorName: LaunchPaper
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiredDeviceCapabilities: [arm64]
        UIBackgroundModes: [audio]
        NSCameraUsageDescription: Snap a page and Yiye turns the writing into text, right on your phone.
        NSPhotoLibraryAddUsageDescription: Saves the pictures you make from notes to your Photos.
        NSMicrophoneUsageDescription: Records what you say and keeps it with the note.
        NSSpeechRecognitionUsageDescription: Turns your voice into text right on your phone.
        # 139：Siri 认不出「一叶笺」：「大管家」「Yiye」也当 App 名字，「叫大管家」「Call Yiye」喊得起来
        INAlternativeAppNames:
          - INAlternativeAppName: 大管家
          - INAlternativeAppName: Yiye
            INAlternativeAppNamePronunciationHint: yee yeah
          - INAlternativeAppName: Butler
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lab.qianshou.yiye
        PRODUCT_NAME: Yiye
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: NO
        ENABLE_PREVIEWS: NO
        SUPPORTS_MACCATALYST: NO
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
  # 陪玩模式的屏幕直播扩展（pc-butler 施工单 100）：只在内存里留最新一帧，主 App 从本机回环取
  YiyeLive:
    type: app-extension
    platform: iOS
    sources:
      - path: YiyeLive
    dependencies:
      - package: YiyeKit
    info:
      path: YiyeLive/Info.plist
      properties:
        CFBundleDisplayName: Yiye
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lab.qianshou.yiye.live
        PRODUCT_NAME: YiyeLive
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        SUPPORTS_MACCATALYST: NO
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
  # 133：列表上真点、真滑、真长按的 UI 测试（shots.sh 截图前跑，不过不发版）
  YiyeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: YiyeUITests
    dependencies:
      - target: Yiye
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lab.qianshou.yiye.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Yiye
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
schemes:
  Yiye:
    build:
      targets:
        Yiye: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - YiyeUITests
    archive:
      config: Release
