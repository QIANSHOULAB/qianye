# 一叶笺 iPhone 版：XcodeGen 在 CI 里生成 Yiye.xcodeproj，不手写 pbxproj
name: Yiye
options:
  bundleIdPrefix: lab.qianshou
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.6.0"
    CURRENT_PROJECT_VERSION: "9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  YiyeKit:
    path: YiyeKit
  YiyeOCR:
    path: YiyeOCR
targets:
  Yiye:
    type: application
    platform: iOS
    sources:
      - path: Yiye
    dependencies:
      - package: YiyeKit
      - package: YiyeOCR
    info:
      path: Yiye/Info.plist
      properties:
        CFBundleDisplayName: Yiye
        CFBundleName: Yiye
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, zh-Hans]
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UIDesignRequiresCompatibility: true
        UILaunchScreen:
          UIColorName: LaunchPaper
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiredDeviceCapabilities: [arm64]
        UIBackgroundModes: [audio]
        NSCameraUsageDescription: Snap a page and Yiye turns the writing into text, right on your phone.
        NSPhotoLibraryAddUsageDescription: Saves the pictures you make from notes to your Photos.
        NSMicrophoneUsageDescription: Records what you say and keeps it with the note.
        NSSpeechRecognitionUsageDescription: Turns your voice into text right on your phone.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lab.qianshou.yiye
        PRODUCT_NAME: Yiye
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: NO
        ENABLE_PREVIEWS: NO
        SUPPORTS_MACCATALYST: NO
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
schemes:
  Yiye:
    build:
      targets:
        Yiye: all
    run:
      config: Debug
    archive:
      config: Release
